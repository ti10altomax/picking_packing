services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-separa}
      POSTGRES_USER: ${POSTGRES_USER:-separa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "9432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "9379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "python manage.py makemigrations core pedidos &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A config worker -l info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - ./certs:/certs:ro
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      # Mount Windows→WSL não emite eventos de arquivo — sem polling, o Next
      # não enxerga edições feitas do lado do Windows e o hot reload "morre"
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: >
      sh -c "if [ -f /certs/cert.pem ] && [ -f /certs/key.pem ]; then
               echo '>>> HTTPS ligado (certs encontrados em /certs)' &&
               npm run dev -- -H 0.0.0.0 --experimental-https --experimental-https-key /certs/key.pem --experimental-https-cert /certs/cert.pem;
             else
               echo '>>> HTTP — coloque cert.pem e key.pem em ./certs/ para HTTPS' &&
               npm run dev -- -H 0.0.0.0;
             fi"
    depends_on:
      - backend

volumes:
  postgres_data:

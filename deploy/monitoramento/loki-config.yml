# Loki — armazenamento de logs para a stack de monitoramento da VM (mp-*).
# Observabilidade do Separa, 2026-10-08. Ver README.md desta pasta.
#
# Modo single-binary, filesystem local, retenção de 30 dias. Cabe num volume
# pequeno: o Separa gera poucas dezenas de MB/dia mesmo com o log de requisição.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h        # 30 dias
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  alertmanager_url: http://localhost:9093
  enable_api: true

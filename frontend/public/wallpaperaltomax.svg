<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="taper" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="15%" stop-color="white" stop-opacity="1"/>
      <stop offset="85%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#000000"/>

  <!-- Linha de cima -->
  <rect x="200" y="80" width="800" height="2.5" fill="url(#taper)"/>

  <!-- ALTOMAX -->
  <text x="600" y="200"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="140"
        font-weight="400"
        fill="white"
        letter-spacing="14">ALTOMAX</text>

  <!-- Linha de baixo -->
  <rect x="200" y="225" width="800" height="2.5" fill="url(#taper)"/>
</svg>
